version: 2

updates:
  - package-ecosystem: composer
    directory: /
    target-branch: trunk
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Chicago
    open-pull-requests-limit: 5
    commit-message:
      prefix: Tools

  - package-ecosystem: npm
    directory: /
    target-branch: trunk
    schedule:
      interval: weekly
      day: monday
      time: "09:15"
      timezone: America/Chicago
    open-pull-requests-limit: 5
    commit-message:
      prefix: Tools

  - package-ecosystem: github-actions
    directory: /
    target-branch: trunk
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: America/Chicago
    open-pull-requests-limit: 5
    commit-message:
      prefix: Tools
